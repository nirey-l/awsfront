name: Deploy Frontend to Amazon EC2 and S3

on:
  push:
    branches: [ "main" ]

env:
  AWS_REGION: us-west-1
  ECR_REPOSITORY: aws-lab-frontend
  S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }} # GitHub Secrets에 등록된 버킷 이름 사용

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    # 1. AWS 인증 설정
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    # 2. ECR 로그인
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    # 3. S3 배포를 위한 빌드 (GitHub Runner 환경)
    # 도커 빌드와 별개로, S3에 올릴 정적 파일들을 생성합니다.
    - name: Build for S3 Deployment
      run: |
        npm install
        REACT_APP_API_BASE_URL=${{ secrets.REACT_APP_API_BASE_URL }} npm run build

    # 4. S3에 빌드된 파일 업로드 (동기화)
    - name: Deploy to Amazon S3
      run: |
        aws s3 sync build/ s3://${{ env.S3_BUCKET_NAME }} --delete

    # 5. Docker 이미지 빌드 및 ECR 푸시 (EC2 배포용)
    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: latest
      run: |
        docker build \
          --build-arg REACT_APP_API_BASE_URL=${{ secrets.REACT_APP_API_BASE_URL }} \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
          .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    # 6. EC2에 접속하여 배포
    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_FRONTEND_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        envs: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION
        script: |
          aws ecr get-login-password --region $AWS_REGION | sudo docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
          
          # 기존 컨테이너 중지 및 삭제
          sudo docker stop frontend-app || true
          sudo docker rm frontend-app || true
          
          # 새 이미지 Pull 및 실행
          sudo docker pull ${{ steps.login-ecr.outputs.registry }}/aws-lab-frontend:latest
          sudo docker run -d --name frontend-app -p 80:80 ${{ steps.login-ecr.outputs.registry }}/aws-lab-frontend:latest